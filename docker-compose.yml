# Banco PostgreSQL local do Raizes PE (schema "origem").
# Subir:    npm run db:up        (equivale a: docker compose up -d --wait)
# Zerar:    npm run db:reset     (apaga o volume e recarrega os scripts)
#
# Os scripts abaixo rodam UMA vez, na ordem do nome, na primeira vez que o volume
# e criado. Para recarregar do zero, use "npm run db:reset".
# Usuario e senha daqui valem so para a maquina local; nao sao credenciais reais.
name: raizes-pe

services:
  db:
    image: postgres:16-alpine
    container_name: raizes-pe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: origem
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - raizes_pe_pgdata:/var/lib/postgresql/data
      # Pasta db/ inteira, somente leitura, para o "npm run db:validar" achar o SQL de conferencia.
      - ./db:/db:ro
      # Carga inicial (a 03 e so de consultas e nao entra aqui).
      - ./db/01_ddl_origem.sql:/docker-entrypoint-initdb.d/01_ddl_origem.sql:ro
      - ./db/02_dados_exemplo_origem.sql:/docker-entrypoint-initdb.d/02_dados_exemplo_origem.sql:ro
      - ./db/04_migracao_front.sql:/docker-entrypoint-initdb.d/04_migracao_front.sql:ro
      - ./db/05_dados_raizes_pe.sql:/docker-entrypoint-initdb.d/05_dados_raizes_pe.sql:ro
      - ./db/06_imagem_produto.sql:/docker-entrypoint-initdb.d/06_imagem_produto.sql:ro
      - ./db/07_autenticacao.sql:/docker-entrypoint-initdb.d/07_autenticacao.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d origem"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  raizes_pe_pgdata:
